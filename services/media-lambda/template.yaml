AWSTemplateFormatVersion: "2010-09-09"
Description: "Hypit media execution service: FFmpeg Layer, function, immutable version, role and logs."

Parameters:
  EnvironmentName:
    Type: String
    AllowedPattern: "[a-z0-9][a-z0-9-]{0,30}"
  FunctionName:
    Type: String
    AllowedPattern: "[A-Za-z0-9-_]{1,64}"
  ExecutionRoleName:
    Type: String
    AllowedPattern: "[A-Za-z0-9+=,.@_-]{1,64}"
  LayerName:
    Type: String
    AllowedPattern: "[A-Za-z0-9-_]{1,140}"
  ArtifactBucket:
    Type: String
  DeploymentBucket:
    Type: String
  FunctionCodeKey:
    Type: String
  FunctionCodeSha256:
    Type: String
  FunctionBundleHash:
    Type: String
  LayerCodeKey:
    Type: String
  LayerArchiveHash:
    Type: String
  MemorySize:
    Type: Number
    Default: 3008
    MinValue: 1024
    MaxValue: 10240
  EphemeralStorageSize:
    Type: Number
    Default: 8192
    MinValue: 512
    MaxValue: 10240
  ReservedConcurrency:
    Type: Number
    Default: 8
    MinValue: 1
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]

Resources:
  MediaLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FunctionName}"
      RetentionInDays: !Ref LogRetentionDays

  MediaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref ExecutionRoleName
      Description: !Sub "Hypit media execution role for ${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: HypitMediaArtifactsAndLogs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadSourcesAndWriteResults
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ArtifactBucket}/*"
              - Sid: WriteFunctionLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${FunctionName}:*"

  MediaFfmpegLayer:
    Type: AWS::Lambda::LayerVersion
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      LayerName: !Ref LayerName
      Description: !Sub "FFmpeg 8.0.1 x86-64 GPL shared; archive sha256 ${LayerArchiveHash}"
      Content:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Ref LayerCodeKey
      CompatibleArchitectures:
        - x86_64
      CompatibleRuntimes:
        - nodejs22.x
      LicenseInfo: GPL-3.0-or-later

  MediaFunction:
    Type: AWS::Lambda::Function
    DependsOn: MediaLogGroup
    Properties:
      FunctionName: !Ref FunctionName
      Description: Hypit remote media execution
      Runtime: nodejs22.x
      RuntimeManagementConfig:
        UpdateRuntimeOn: FunctionUpdate
      Handler: index.handler
      Architectures:
        - x86_64
      Role: !GetAtt MediaExecutionRole.Arn
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Ref FunctionCodeKey
      Layers:
        - !Ref MediaFfmpegLayer
      MemorySize: !Ref MemorySize
      Timeout: 900
      EphemeralStorage:
        Size: !Ref EphemeralStorageSize
      ReservedConcurrentExecutions: !Ref ReservedConcurrency
      Environment:
        Variables:
          HYPIT_MEDIA_BUNDLE_HASH: !Ref FunctionBundleHash
          HYPIT_FFMPEG_VERSION: "8.0.1"
          FFMPEG_PATH: /opt/bin/ffmpeg
          FFPROBE_PATH: /opt/bin/ffprobe
          HYPIT_FFMPEG_LIBRARY_PATH: /opt/lib

  MediaFunctionVersion:
    Type: AWS::Lambda::Version
    DeletionPolicy: RetainExceptOnCreate
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref MediaFunction
      CodeSha256: !Ref FunctionCodeSha256
      Description: !Sub "function ${FunctionBundleHash}; layer ${LayerArchiveHash}"

Outputs:
  FunctionVersionArn:
    Description: Immutable function ARN for @hypit/provider-media-aws-lambda.
    Value: !Ref MediaFunctionVersion
  LayerVersionArn:
    Description: Immutable FFmpeg Layer version used by the function.
    Value: !Ref MediaFfmpegLayer
  ExecutionRoleArn:
    Value: !GetAtt MediaExecutionRole.Arn
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  RuntimeProfileEndpoint:
    Description: Endpoint entry; parse this output as JSON.
    Value: !Sub
      - '{"use":"@hypit/provider-media-aws-lambda","instance":"media.aws-lambda.${EnvironmentName}","lane":"media","config":{"functionArn":"${FunctionVersionArn}","bucket":"${ArtifactBucket}","region":"${AWS::Region}","defaultConcurrency":${ReservedConcurrency}}}'
      - FunctionVersionArn: !Ref MediaFunctionVersion
