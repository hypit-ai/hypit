name: surreel
description: "Surreel creative video studio, powered by CodeGraff and Hypit."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
