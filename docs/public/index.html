<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Hypit documentation</title>
    <link rel="canonical" href="quickstart" />
    <!--
      The site root is not a page. It sends a reader to the quickstart in the
      language they last read, falling back to the browser's own preference.
      `hypit-locale` is the key LocalePreference.vue writes on every doc page.

      Every path here is relative, so this file works both under the dev
      server's /docs/ base and at the domain root the Pages deploy publishes.
    -->
    <script>
      (function () {
        var locale;
        try {
          locale = window.localStorage.getItem("hypit-locale");
        } catch (error) {
          // Storage can be unavailable in private or restricted browser contexts.
        }
        if (!locale) {
          locale = (navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
        }
        var target = locale === "zh" ? "zh/quickstart" : "quickstart";
        location.replace(target + location.search + location.hash);
      })();
    </script>
  </head>
  <body>
    <noscript>
      <p><a href="quickstart">Quickstart</a></p>
      <p><a href="zh/quickstart">快速开始</a></p>
    </noscript>
  </body>
</html>
