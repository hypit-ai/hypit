name: CI

on:
  push:
    branches: [main]
    # Documentation-only changes are covered by deploy-pages.yml, which builds the site and runs
    # the same repository hygiene checks. Nothing under docs/ is in tsconfig's include or reachable
    # from the test suite, so type checking and the full test suite would prove nothing here.
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Repository hygiene
        run: pnpm test:release

  # Nothing here has ever run on Windows, so Windows-only breakage has been reaching authors
  # instead of this file: a render whose temporary paths ran past the length a Windows path may
  # be, a transcriber that opened a console window per worker, a script that could not import
  # itself. Those are fixed, and this job is what keeps the next one from travelling the same way.
  #
  # It starts non-blocking on purpose. The first runs are here to report what Windows actually
  # finds — a list nobody has seen yet should not be blocking every merge while it is read. Drop
  # continue-on-error once the list is closed, fold both jobs into one os matrix, and update the
  # required checks: the context name changes from `check` to `check (ubuntu-latest)` and
  # `check (windows-latest)`, and branch protection stops enforcing silently if it is left behind.
  #
  # Neither runner image ships ffmpeg, so the media tests that probe for it skip on both legs
  # alike. That gap is real and older than this job; closing it means adding ffmpeg to both, not
  # to one, which would make a red Windows leg ambiguous between the two causes.
  check-windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Repository hygiene
        run: pnpm test:release
