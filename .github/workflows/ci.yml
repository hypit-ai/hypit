name: CI

on:
  push:
    branches: [main]
    # Documentation-only changes are covered by deploy-pages.yml, which builds the site and runs
    # the same repository hygiene checks. Nothing under docs/ is in tsconfig's include or reachable
    # from the test suite, so type checking and the full test suite would prove nothing here.
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Repository hygiene
        run: pnpm test:release
