name: CI

on:
  push:
    branches: [main]
    # Nothing under docs/ is in tsconfig's include or reachable from the test suite, so
    # documentation-only changes are intentionally excluded from this package CI.
    paths-ignore:
      - "docs/**"
  pull_request:
    paths-ignore:
      - "docs/**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Windows-only breakage used to reach authors instead of this file — a render whose temporary
    # paths ran past the length a Windows path may be, a transcriber that opened a console window
    # per worker, a script that could not import itself, a file name that on one platform was the
    # whole path. One matrix rather than two jobs, so a step added here cannot be added to only
    # one of them.
    #
    # Neither runner image ships ffmpeg, so the media tests that probe for it skip on both legs
    # alike. That gap is real and older than this matrix; closing it means adding ffmpeg to both,
    # not to one, which would leave a red leg ambiguous between the two causes.
    runs-on: ${{ matrix.os }}
    strategy:
      # Breakage on one platform is a different finding from breakage on the other, and cancelling
      # the second leg would throw away the half of the answer nobody has yet.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test
