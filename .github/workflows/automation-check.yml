name: Check repository analysis
on:
  pull_request:
    paths: ['.github/automation/**', '.github/workflows/repository-analysis.yml', '.github/workflows/automation-check.yml']
  push:
    branches: [main]
    paths: ['.github/automation/**', '.github/workflows/repository-analysis.yml', '.github/workflows/automation-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --test .github/automation/analysis.test.mjs
