name: Notify HypiHub of documentation updates

on:
  push:
    branches: [main]
    paths:
      - "docs/*.md"
      - "docs/**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch documentation sync
        env:
          GH_TOKEN: ${{ secrets.HYPIHUB_SYNC_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          test -n "$GH_TOKEN"
          payload=$(jq -n \
            --arg event_type "hypit-docs-updated" \
            --arg source_repo "$SOURCE_REPO" \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_ref "$SOURCE_REF" \
            '{event_type: $event_type, client_payload: {
              source_repo: $source_repo,
              source_sha: $source_sha,
              source_ref: $source_ref
            }}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/hypit-ai/hypihub/dispatches"
